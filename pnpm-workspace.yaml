# Packages allowed to run install scripts.
#
# pnpm 11 blocks post-install scripts by default — it is a supply-chain defence,
# and a good one. But some packages genuinely need them: esbuild downloads the
# platform's native binary in `postinstall`, and without it neither tsup nor
# vitest starts.
#
# Declared here instead of approved with `pnpm approve-builds` because the
# interactive approval lands in a local folder and CI would fail again.
allowBuilds:
  esbuild: true
