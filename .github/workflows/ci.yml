name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push cancels the previous run on the same branch: nobody wants the
# result of a commit that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile fails if the lockfile does not match package.json. It is
      # what stops a dependency from slipping to a version other than the one
      # tested locally.
      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      - run: pnpm build

      # dist has to exist: it is what a git dependency delivers to the two
      # consumers. A silently empty build would break both repos.
      - name: Check the build produced artefacts
        run: test -f dist/index.js && test -f dist/index.cjs && test -f dist/index.d.ts

      # `dist/` is versioned because pnpm 11 blocks install scripts of git
      # dependencies. That creates a new risk: someone changes a schema, forgets to
      # rebuild, and the consumers get the old contract under the new version
      # number — the worst kind of incompatibility, because it is silent.
      #
      # This step makes forgetting impossible: it rebuilds and fails if the result
      # differs from what is in the repository.
      - name: Check dist is in sync with src
        run: |
          if ! git diff --exit-code --stat -- dist; then
            echo "::error::dist/ is out of date. Run 'pnpm build' and commit the result."
            exit 1
          fi
